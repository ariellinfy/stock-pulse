x-airflow-build: &airflow-common-build
  context: .
  dockerfile: airflow/Dockerfile

x-airflow-common: &airflow-common
  build: *airflow-common-build
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Taipei
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Taipei
    # 讓容器內的 Python 能找到我們的 scrapers/、shared/ 模組
    PYTHONPATH: /opt/airflow/project
    # 讓 shared/utils.py 的 get_required_env() 能讀到這些值
    GCP_BUCKET_NAME: ${GCP_BUCKET_NAME}
    GCP_SA_KEY_PATH: /opt/airflow/secrets/gcp-sa-key.json
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./scrapers:/opt/airflow/project/scrapers
    - ./shared:/opt/airflow/project/shared
    - ./secrets:/opt/airflow/secrets:ro # 掛載金鑰(唯讀,容器不需要寫入它)
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  backfill:
    build: *airflow-common-build
    environment:
      GCP_BUCKET_NAME: ${GCP_BUCKET_NAME}
      GCP_SA_KEY_PATH: /opt/airflow/secrets/gcp-sa-key.json
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ./scrapers:/opt/airflow/project/scrapers
      - ./shared:/opt/airflow/project/shared
      - ./scripts:/opt/airflow/project/scripts
      - ./secrets:/opt/airflow/secrets:ro
    entrypoint: ""
    profiles:
      - tools # 標記成工具型服務,docker compose up 不會自動啟動它

volumes:
  postgres-db-volume: