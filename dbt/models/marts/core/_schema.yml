version: 2

models:
  - name: dim_stock
    columns:
      - name: stock_id
        tests:
          - unique
          - not_null
      - name: market
        tests:
          - accepted_values:
              values: ['TWSE', 'TPEx']
      - name: listing_date
        tests:
          - dbt_utils.accepted_range:
              max_value: "current_date()"
              config:
                where: "listing_date is not null"

  - name: dim_date
    columns:
      - name: calendar_date
        tests:
          - unique
          - not_null

  - name: dim_industry
    columns:
      - name: industry_code
        tests:
          - unique
          - not_null